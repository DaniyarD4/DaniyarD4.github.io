<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Страница не найдена | Данияр Нурсалимов</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#12324F">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --porcelain:#FBFCFD; --ink:#0E1E30; --slate:#5A6E82;
    --navy:#12324F; --azure:#2E7DD1; --hairline:#E6EDF4;
    --ease:cubic-bezier(.22,.72,.24,1);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;min-height:100svh;
    display:flex;align-items:center;justify-content:center;
    background:var(--porcelain);color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    padding:24px;text-align:center;
  }
  .code{
    font-family:'Instrument Serif',Georgia,serif;
    font-size:clamp(64px,14vw,120px);line-height:1;
    color:var(--navy);margin:0;
  }
  h1{
    font-family:'Instrument Serif',Georgia,serif;font-weight:400;
    font-size:clamp(22px,4vw,32px);margin:16px 0 0;
  }
  p{color:var(--slate);margin:16px 0 0;font-size:15.5px;line-height:1.7;}
  .rule{width:60px;height:1px;background:var(--azure);margin:28px auto;}
  a.btn{
    display:inline-flex;align-items:center;gap:10px;
    margin-top:8px;padding:14px 26px;border-radius:999px;
    background:var(--ink);color:#fff;text-decoration:none;
    font-size:14px;font-weight:600;
    transition:transform .3s var(--ease),box-shadow .3s var(--ease);
    box-shadow:0 10px 26px -14px rgba(14,30,48,.6);
  }
  a.btn:hover{transform:translateY(-2px);box-shadow:0 18px 38px -16px rgba(14,30,48,.55);}
</style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Такой страницы нет</h1>
    <div class="rule"></div>
    <p>Возможно, ссылка устарела или в адресе опечатка.<br>Вернитесь на главную — все работы там.</p>
    <a class="btn" href="/">На главную</a>
  </main>
</body>
</html>
