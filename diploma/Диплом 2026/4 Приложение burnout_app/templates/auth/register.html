<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Регистрация — БВТ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}"/>
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-card auth-card--wide">
      <div class="auth-header">
        <div class="auth-logo">◈</div>
        <h1 class="auth-title">Регистрация</h1>
        <p class="auth-subtitle">Создайте аккаунт для работы с системой</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=True) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash flash--{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" class="auth-form">
        <div class="form-row">
          <div class="form-group">
            <label for="username" class="form-label">Имя пользователя *</label>
            <input type="text" id="username" name="username" class="form-input" required placeholder="login"/>
          </div>
          <div class="form-group">
            <label for="full_name" class="form-label">Полное имя</label>
            <input type="text" id="full_name" name="full_name" class="form-input" placeholder="Иван Иванов"/>
          </div>
        </div>
        <div class="form-group">
          <label for="email" class="form-label">Email *</label>
          <input type="email" id="email" name="email" class="form-input" required placeholder="mail@example.com"/>
        </div>
        <div class="form-group">
          <label for="department" class="form-label">Подразделение</label>
          <input type="text" id="department" name="department" class="form-input" placeholder="Кафедра / отдел"/>
        </div>
        <div class="form-group">
          <label class="form-label">Роль *</label>
          <div class="role-selector">
            <label class="role-option">
              <input type="radio" name="role" value="tutor" checked/>
              <span class="role-card">
                <span class="role-icon">👤</span>
                <span class="role-name">Тьютор</span>
                <span class="role-desc">Прохождение опросов</span>
              </span>
            </label>
            <label class="role-option">
              <input type="radio" name="role" value="hr"/>
              <span class="role-card">
                <span class="role-icon">📊</span>
                <span class="role-name">HR / Куратор</span>
                <span class="role-desc">Управление и аналитика</span>
              </span>
            </label>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="password" class="form-label">Пароль *</label>
            <input type="password" id="password" name="password" class="form-input" required placeholder="мин. 6 символов"/>
          </div>
          <div class="form-group">
            <label for="password2" class="form-label">Повторите пароль *</label>
            <input type="password" id="password2" name="password2" class="form-input" required placeholder="повторите пароль"/>
          </div>
        </div>
        <button type="submit" class="btn btn--primary btn--full">Зарегистрироваться</button>
      </form>

      <p class="auth-footer">Уже есть аккаунт? <a href="{{ url_for('auth.login') }}">Войти</a></p>
    </div>
  </div>
</body>
</html>
